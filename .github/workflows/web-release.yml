name: Benchmarks Web Release
run-name: >-
  ${{
    github.event_name == 'repository_dispatch' &&
    format(
      'Switchboard benchmarks web {0} release {1} {2}',
      github.event.client_payload.environment || 'production',
      github.event.client_payload.deploy_ref || 'main',
      github.event.client_payload.switchboard_correlation_id || github.run_id
    ) ||
    format('Benchmarks Web {0} release', inputs.environment || 'production')
  }}

on:
  repository_dispatch:
    types: [switchboard_benchmarks_web_release]
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to release to.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      deploy_ref:
        description: Branch, tag, or SHA to release.
        required: false
        default: main
        type: string

concurrency:
  group: benchmarks-web-${{ github.event.client_payload.environment || inputs.environment || 'production' }}-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Resolve release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      deploy_ref: ${{ steps.release.outputs.deploy_ref }}
      environment: ${{ steps.release.outputs.environment }}
      marker_branch: ${{ steps.release.outputs.marker_branch }}
      mode: ${{ steps.release.outputs.mode }}
      promotion_origin: ${{ steps.release.outputs.promotion_origin }}
      selected_deploy_action_ids: ${{ steps.release.outputs.selected_deploy_action_ids }}

    steps:
      - name: Resolve release request
        id: release
        env:
          DISPATCH_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          DISPATCH_MODE: ${{ github.event.client_payload.mode }}
          DISPATCH_ORIGIN: ${{ github.event.client_payload.promotion_origin }}
          DISPATCH_REF: ${{ github.event.client_payload.deploy_ref }}
          DISPATCH_SELECTED_DEPLOY_ACTION_IDS: ${{ toJSON(github.event.client_payload.selected_deploy_action_ids) }}
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
          MANUAL_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail

          environment="${DISPATCH_ENVIRONMENT:-${MANUAL_ENVIRONMENT:-production}}"
          deploy_ref="${DISPATCH_REF:-${MANUAL_REF:-main}}"
          mode="${DISPATCH_MODE:-safe}"
          promotion_origin="${DISPATCH_ORIGIN:-manual}"

          case "$environment" in
            staging)
              marker_branch=""
              ;;
            production)
              marker_branch="production-web"
              ;;
            *)
              echo "::error::environment must be staging or production."
              exit 1
              ;;
          esac

          case "$mode" in
            safe|plan|deploy_only) ;;
            *)
              echo "::error::mode must be safe, plan, or deploy_only."
              exit 1
              ;;
          esac
          case "$promotion_origin" in
            automatic|manual) ;;
            *)
              echo "::error::promotion_origin must be automatic or manual."
              exit 1
              ;;
          esac
          selected_deploy_action_ids="$(
            jq -c --arg environment "$environment" '
              if type == "array"
              then .
              elif $environment == "production"
              then ["benchmarks.web.production.release"]
              else []
              end
            ' <<<"$DISPATCH_SELECTED_DEPLOY_ACTION_IDS"
          )"
          if [ "$environment" = "production" ] &&
            ! jq -e 'index("benchmarks.web.production.release") != null' <<<"$selected_deploy_action_ids" >/dev/null; then
            echo "::error::The Benchmarks Web production release action was not selected."
            exit 1
          fi

          {
            echo "environment=${environment}"
            echo "deploy_ref=${deploy_ref}"
            echo "marker_branch=${marker_branch}"
            echo "mode=${mode}"
            echo "promotion_origin=${promotion_origin}"
            echo "selected_deploy_action_ids=${selected_deploy_action_ids}"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and release Benchmarks Web
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      deployments: write
    environment:
      name: ${{ needs.context.outputs.environment == 'staging' && 'Preview' || 'Production' }}
      url: ${{ steps.release.outputs.deployment-url }}

    steps:
      - name: Checkout requested release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.deploy_ref }}
          persist-credentials: ${{ needs.context.outputs.environment == 'production' }}

      - name: Resolve release SHA
        id: revision
        run: echo "resolved_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check production marker
        id: marker
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.context.outputs.environment }}
          MARKER_BRANCH: ${{ needs.context.outputs.marker_branch }}
          RESOLVED_SHA: ${{ steps.revision.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          skipped=false
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            git fetch origin "${MARKER_BRANCH}:refs/remotes/origin/${MARKER_BRANCH}" 2>/dev/null || true
            if git rev-parse --verify "origin/${MARKER_BRANCH}" >/dev/null 2>&1 &&
              [ "$RESOLVED_SHA" = "$(git rev-parse "origin/${MARKER_BRANCH}")" ]; then
              skipped=true
              echo "${MARKER_BRANCH} already points to ${RESOLVED_SHA}; nothing to release."
            fi
          fi
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"

      - name: Generate token for Switchboard
        id: app_token
        if: steps.marker.outputs.skipped != 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: coval-ai
          repositories: ci-cd-switchboard
          permission-contents: read

      - name: Checkout Switchboard release action
        if: steps.marker.outputs.skipped != 'true'
        uses: actions/checkout@v7
        with:
          repository: coval-ai/ci-cd-switchboard
          ref: a973276e4639129a06cef4cf92409d4aa8e1e305
          token: ${{ steps.app_token.outputs.token }}
          path: switchboard-src
          persist-credentials: false

      - name: Run shared Vercel release
        id: release
        if: steps.marker.outputs.skipped != 'true'
        uses: ./switchboard-src/.github/actions/vercel-release
        with:
          environment: ${{ needs.context.outputs.environment }}
          resolved-sha: ${{ steps.revision.outputs.resolved_sha }}
          marker-branch: ${{ needs.context.outputs.marker_branch }}
          install-directory: web
          vercel-directory: .
          package-manager: pnpm
          node-version: "22"
          pre-build-command: |
            set -euo pipefail
            environment_file=".vercel/.env.${VERCEL_ENVIRONMENT}.local"
            if [ ! -f "$environment_file" ]; then
              echo "::error::${environment_file} was not created by vercel pull."
              exit 1
            fi
            set -a
            source "$environment_file"
            set +a
            if [ -z "${NEXT_PUBLIC_API_URL:-}" ]; then
              echo "::error::NEXT_PUBLIC_API_URL is required for benchmarks web codegen."
              exit 1
            fi
            cd web
            pnpm codegen
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BENCHMARKS_WEB_PROJECT_ID }}

      - name: Summarize skipped release
        if: steps.marker.outputs.skipped == 'true'
        run: |
          {
            echo "## Benchmarks Web ${{ needs.context.outputs.environment }} release"
            echo ""
            echo "- Commit: \`${{ steps.revision.outputs.resolved_sha }}\`"
            echo "- Skipped: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record verified deployment result
        env:
          DEPLOYMENT_PERFORMED: ${{ steps.release.outputs.deployed || 'false' }}
          DEPLOYMENT_URL: ${{ steps.release.outputs.deployment-url }}
          DEPLOY_MODE: ${{ needs.context.outputs.mode }}
          RELEASE_ENVIRONMENT: ${{ needs.context.outputs.environment }}
          REQUESTED_REF: ${{ needs.context.outputs.deploy_ref }}
          RESOLVED_SHA: ${{ steps.revision.outputs.resolved_sha }}
          SELECTED_DEPLOY_ACTION_IDS: ${{ needs.context.outputs.selected_deploy_action_ids }}
        run: |
          set -euo pipefail
          case "$RELEASE_ENVIRONMENT" in
            staging) canonical_environment="staging" ;;
            production) canonical_environment="prod" ;;
          esac
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          result_path="${RUNNER_TEMP}/switchboard-deploy-result.json"
          jq -n \
            --arg canonical_environment "$canonical_environment" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg mode "$DEPLOY_MODE" \
            --arg requested_ref "$REQUESTED_REF" \
            --arg run_url "$run_url" \
            --arg source_sha "$RESOLVED_SHA" \
            --argjson deployment_performed "$DEPLOYMENT_PERFORMED" \
            --argjson selected_deploy_action_ids "$SELECTED_DEPLOY_ACTION_IDS" \
            '{
              schema_version: 1,
              service: "benchmarks.web",
              environment: $canonical_environment,
              mode: $mode,
              source: {repository: "coval-ai/benchmarks", requested_ref: $requested_ref, resolved_sha: $source_sha},
              adapter: {kind: "repository_dispatch", run_url: $run_url},
              selected_deploy_action_ids: $selected_deploy_action_ids,
              deploy_action_results: ($selected_deploy_action_ids | map({id: ., conclusion: "success", evidence_url: $run_url})),
              deployment_performed: $deployment_performed,
              canaries: [{
                id: "benchmarks.web.vercel-release",
                name: "Vercel release",
                conclusion: (if $deployment_performed then "success" else "skipped" end),
                evidence_url: (if $deployment_performed then $deployment_url else $run_url end)
              }],
              generated_artifact_publications: [],
              overall_status: "success",
              evidence_urls: ([$run_url] + if $deployment_performed then [$deployment_url] else [] end)
            }
            + if $deployment_performed then {
                built_artifact: {kind: "vercel_deployment", identity: $deployment_url, url: $deployment_url},
                live_artifact: {identity: $deployment_url, verified: true, evidence_url: $deployment_url}
              } else {} end' > "$result_path"

      - name: Upload verified deployment result
        uses: actions/upload-artifact@v6
        with:
          name: switchboard-deploy-result
          path: ${{ runner.temp }}/switchboard-deploy-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish manually selected production state
        if: >-
          needs.context.outputs.promotion_origin == 'manual' &&
          needs.context.outputs.environment == 'production' &&
          steps.release.outputs.deployed == 'true'
        uses: ./switchboard-src/.github/actions/switchboard-publish-deployment-state
        with:
          environment: prod
          repository: coval-ai/benchmarks
          result-path: ${{ runner.temp }}/switchboard-deploy-result.json
          service: benchmarks.web
          token: ${{ github.token }}
