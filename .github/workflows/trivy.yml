name: Trivy

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  scan:
    name: Scan deployed ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runner
          - image: api

    env:
      IMAGE: us-east1-docker.pkg.dev/coval-benchmarks-prod/runner/coval-bench-${{ matrix.image }}

    steps:
      - name: Resolve deployed SHA from production-runner
        id: deployed
        run: |
          set -euo pipefail
          sha="$(git ls-remote --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" production-runner | cut -f1)"
          [ -n "$sha" ] || { echo "::error::production-runner marker branch not found"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SCANNER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Resolve tag to digest
        id: digest
        env:
          SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          set -euo pipefail
          digest="$(gcloud artifacts docker images describe "${IMAGE}:${SHA}" --format='value(image_summary.digest)')"
          [ -n "$digest" ] || { echo "::error::${IMAGE}:${SHA} has no digest in Artifact Registry"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${IMAGE}@${digest} (production-runner ${SHA})"

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Summary
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          NAME: ${{ matrix.image }}
        run: |
          {
            echo "## Deployed ${NAME} image"
            echo ""
            echo "- Scanned: \`${IMAGE}@${DIGEST}\`"
            echo "- Fixable HIGH/CRITICAL findings: $(jq '[.runs[].results[]] | length' "trivy-${NAME}.sarif")"
          } >> "$GITHUB_STEP_SUMMARY"
